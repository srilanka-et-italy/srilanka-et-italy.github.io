# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject secrets into Firebase config
        run: |
          sed -i "s/__FIREBASE_API_KEY__/${{ secrets.FIREBASE_API_KEY }}/g" js/firebase-config.js
          sed -i "s/__RECAPTCHA_SITE_KEY__/${{ secrets.RECAPTCHA_SITE_KEY }}/g" js/firebase-config.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SRILANKA_ET_ITALY }}
          channelId: live
          projectId: srilanka-et-italy
      - name: Deploy Firestore and Storage rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SRILANKA_ET_ITALY }}' > /tmp/gcp-key.json
          npx firebase-tools deploy --only firestore:rules,storage --project srilanka-et-italy --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
