<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Sri Lanka ET Italy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="admin-login-screen">
    <div class="admin-login-card">
      <p class="admin-login-eyebrow">Sri Lanka ET Italy</p>
      <h1 class="admin-login-title" data-i18n="admin.login_title">Admin Login</h1>

      <div class="admin-lang-switch">
        <button class="admin-lang-btn active" data-lang="de">DE</button>
        <button class="admin-lang-btn" data-lang="en">EN</button>
        <button class="admin-lang-btn" data-lang="ta">TA</button>
      </div>

      <form id="login-form" novalidate>
        <div class="admin-field">
          <label for="email" data-i18n="admin.email_label">E-Mail</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="admin-field">
          <label for="password" data-i18n="admin.password_label">Passwort</label>
          <div class="admin-password-wrap">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="admin-pw-toggle" aria-label="Passwort anzeigen">👁</button>
          </div>
        </div>
        <p id="login-error" class="admin-error" hidden></p>
        <button type="submit" class="btn-dark admin-submit" data-i18n="admin.login_btn">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- Admin Panel (hidden until authenticated) -->
  <div id="admin-panel" class="admin-panel" hidden>
    <header class="admin-header">
      <div class="admin-header-brand">
        <span class="admin-header-logo">Sri Lanka <em>ET</em> Italy</span>
        <span class="admin-header-badge" data-i18n="admin.header_badge">Admin</span>
      </div>
      <div class="admin-header-right">
        <div class="admin-header-langs">
          <button class="admin-lang-btn active" data-lang="de">DE</button>
          <button class="admin-lang-btn" data-lang="en">EN</button>
          <button class="admin-lang-btn" data-lang="ta">TA</button>
        </div>
        <button id="logout-btn" class="btn-outline" data-i18n="admin.logout_btn">Abmelden</button>
      </div>
    </header>
    <main class="admin-main">
      <div class="admin-panel-langs">
        <button class="admin-lang-btn active" data-lang="de">DE</button>
        <button class="admin-lang-btn" data-lang="en">EN</button>
        <button class="admin-lang-btn" data-lang="ta">TA</button>
      </div>

      <div class="launcher-wrap">
        <div class="launcher-category" data-i18n="admin.launcher_category">Speisekarten</div>
        <div class="launcher-grid">
          <a href="admin-main-menu.html" class="launcher-tile">
            <div class="launcher-tile-icon launcher-tile-icon--custom">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
                <defs>
                  <linearGradient id="menu-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#c5a059;" />
                    <stop offset="100%" style="stop-color:#9a7b3e;" />
                  </linearGradient>
                  <linearGradient id="bg-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#2a363f;" />
                    <stop offset="100%" style="stop-color:#151d24;" />
                  </linearGradient>
                </defs>

                <circle cx="256" cy="256" r="240" fill="url(#bg-dark)" stroke="url(#menu-grad)" stroke-width="8" />

                <path d="M 140 120 L 256 150 L 372 120 L 372 370 L 256 400 L 140 370 Z" fill="#ffffff" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.3))" />

                <path d="M 256 150 L 256 400" stroke="url(#menu-grad)" stroke-width="4" stroke-dasharray="6,4" />
                <path d="M 140 370 C 140 370, 198 385, 256 370 C 314 385, 372 370, 372 370" fill="none" stroke="#dcdde1" stroke-width="6" />

                <line x1="170" y1="190" x2="226" y2="200" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round" />
                <line x1="170" y1="230" x2="210" y2="240" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round" />
                <line x1="170" y1="270" x2="226" y2="280" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round" />
                <line x1="170" y1="310" x2="200" y2="318" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round" />

                <line x1="286" y1="200" x2="342" y2="190" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round" />
                <line x1="302" y1="240" x2="342" y2="230" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round" />
                <line x1="286" y1="280" x2="342" y2="270" stroke="#7f8c8d" stroke-width="8" stroke-linecap="round" />
                <line x1="286" y1="318" x2="316" y2="310" stroke="#7f8c8d" stroke-width="6" stroke-linecap="round" />

                <path d="M 180 340 L 180 320 M 184 320 L 184 330 M 176 320 L 176 330" stroke="url(#menu-grad)" stroke-width="2.5" stroke-linecap="round" />
                <ellipse cx="328" cy="324" rx="5" ry="8" fill="url(#menu-grad)" />
                <line x1="328" y1="332" x2="328" y2="342" stroke="url(#menu-grad)" stroke-width="2.5" />
              </svg>
            </div>
            <span class="launcher-tile-label" data-i18n="admin.main_menu_title">Hauptspeisekarte</span>
          </a>
          <a href="admin-seasonal-pdfs.html" class="launcher-tile">
            <div class="launcher-tile-icon launcher-tile-icon--custom">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
                <defs>
                  <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#ff7e5f;" />
                    <stop offset="100%" style="stop-color:#feb47b;" />
                  </linearGradient>
                  <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#2c3e50;" />
                    <stop offset="100%" style="stop-color:#1a252f;" />
                  </linearGradient>
                  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
                  </filter>
                </defs>

                <circle cx="256" cy="256" r="240" fill="url(#orange-grad)" />

                <path d="M 256 60 L 290 110 L 345 95 L 355 150 L 412 155 L 395 210 L 440 245 L 400 285 L 425 340 L 370 355 L 370 412 L 315 400 L 285 440 L 245 400 L 190 425 L 175 370 L 118 370 L 130 315 L 90 285 L 130 245 L 105 190 L 160 175 L 160 118 L 215 130 Z" fill="url(#blue-grad)" filter="url(#shadow)" />

                <g transform="translate(190, 180)" fill="#ffffff">
                  <path d="M 40 30 L 100 0 L 115 80 L 40 50 Z" fill="#ffffff" />
                  <path d="M 50 45 L 35 85 C 30 85, 25 80, 30 70 L 42 45 Z" fill="#e2e8f0" />
                  <path d="M 30 32 C 30 22, 45 22, 45 32 L 45 48 C 45 58, 30 58, 30 48 Z" fill="#ff7e5f" />
                  <path d="M 130 15 C 145 25, 145 55, 130 65" stroke="#feb47b" stroke-width="8" stroke-linecap="round" fill="none" />
                  <path d="M 145 3 C 170 18, 170 62, 145 77" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" />
                </g>

                <text x="235" y="340" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="75" font-weight="900" fill="#feb47b" text-anchor="middle">SALE</text>
              </svg>
            </div>
            <span class="launcher-tile-label" data-i18n="admin.list_title">Header-Flyer</span>
          </a>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script type="module" src="js/admin-home.js"></script>
</body>
</html>
