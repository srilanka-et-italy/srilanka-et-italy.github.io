<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wartungsmodus — Admin — Sri Lanka ET Italy</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <meta name="robots" content="noindex, nofollow">
</head>
<body>

  <!-- Login Screen -->
  <div id="login-screen" class="admin-login-screen" hidden>
    <div class="admin-login-card">
      <p class="admin-login-eyebrow">Sri Lanka ET Italy</p>
      <h1 class="admin-login-title" data-i18n="admin.login_title">Admin Login</h1>

      <div class="admin-lang-switch">
        <button class="admin-lang-btn active" data-lang="de">DE</button>
        <button class="admin-lang-btn" data-lang="en">EN</button>
        <button class="admin-lang-btn" data-lang="ta">TA</button>
      </div>

      <form id="login-form" novalidate>
        <div class="admin-field">
          <label for="email" data-i18n="admin.email_label">E-Mail</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="admin-field">
          <label for="password" data-i18n="admin.password_label">Passwort</label>
          <div class="admin-password-wrap">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" id="toggle-password" class="admin-pw-toggle" aria-label="Passwort anzeigen">👁</button>
          </div>
        </div>
        <p id="login-error" class="admin-error" hidden></p>
        <button type="submit" class="btn-dark admin-submit" data-i18n="admin.login_btn">Anmelden</button>
      </form>
    </div>
  </div>

  <!-- Admin Panel (hidden until authenticated) -->
  <div id="admin-panel" class="admin-panel" hidden>
    <header class="admin-header">
      <div class="admin-header-brand">
        <a href="admin.html" class="tile-panel-back" aria-label="Zurück">←</a>
        <span class="admin-header-logo">Sri Lanka <em>ET</em> Italy</span>
        <span class="admin-header-badge" data-i18n="admin.header_badge">Admin</span>
      </div>
      <div class="admin-header-right">
        <div class="admin-header-langs">
          <button class="admin-lang-btn active" data-lang="de">DE</button>
          <button class="admin-lang-btn" data-lang="en">EN</button>
          <button class="admin-lang-btn" data-lang="ta">TA</button>
        </div>
        <button id="logout-btn" class="btn-outline" data-i18n="admin.logout_btn">Abmelden</button>
      </div>
    </header>
    <main class="admin-main">
      <div class="admin-panel-langs">
        <button class="admin-lang-btn active" data-lang="de">DE</button>
        <button class="admin-lang-btn" data-lang="en">EN</button>
        <button class="admin-lang-btn" data-lang="ta">TA</button>
      </div>

      <div class="admin-section">
        <div class="admin-section-header">
          <h2 class="admin-section-title" data-i18n="admin.maintenance_title">Wartungsmodus</h2>
        </div>

        <div class="admin-field">
          <label for="maintenance-enabled">
            <input type="checkbox" id="maintenance-enabled">
            <span data-i18n="admin.maintenance_toggle_label">Wartungsmodus aktiv (Website für Besucher gesperrt)</span>
          </label>
        </div>
        <p id="maintenance-hint" class="admin-error" hidden data-i18n="admin.maintenance_active_hint">Achtung: Die Website ist für Besucher gesperrt. Der Admin-Bereich bleibt erreichbar.</p>

        <div class="admin-field" id="maintenance-text-field">
          <label data-i18n="admin.maintenance_text_label">Hinweistext (optional, leer = Standardtext)</label>
          <div class="admin-lang-tabs" id="maintenance-lang-tabs">
            <button type="button" class="admin-lang-tab active" data-lang="de">DE</button>
            <button type="button" class="admin-lang-tab" data-lang="en">EN</button>
            <button type="button" class="admin-lang-tab" data-lang="ta">TA</button>
          </div>
          <div class="admin-title-pane active" data-lang-pane="de"><textarea id="maintenance-text-de" rows="3"></textarea></div>
          <div class="admin-title-pane" data-lang-pane="en"><textarea id="maintenance-text-en" rows="3"></textarea></div>
          <div class="admin-title-pane" data-lang-pane="ta"><textarea id="maintenance-text-ta" rows="3"></textarea></div>
        </div>

        <p id="maintenance-error" class="admin-error" hidden></p>
        <p id="maintenance-success" class="admin-success" hidden data-i18n="admin.maintenance_success">Wartungsmodus gespeichert.</p>
        <button id="maintenance-save-btn" type="button" class="btn-dark" data-i18n="admin.maintenance_save_btn">Speichern</button>
      </div>
    </main>
  </div>

  <script src="js/vendor/purify.min.js"></script>
  <script type="module" src="js/admin-maintenance.js"></script>
</body>
</html>
